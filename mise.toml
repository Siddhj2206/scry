[tools]
rust = "latest"

[env]
RUST_LOG = "scry=debug,info"

[tasks.check]
run = "cargo check --all-targets"

[tasks.build]
run = "cargo build"

[tasks.test]
run = "cargo test"

[tasks.clippy]
run = "cargo clippy --all-targets -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.fmt-check]
run = "cargo fmt --all -- --check"

[tasks.ci]
depends = ["fmt-check", "clippy", "test"]

[tasks.container-build]
run = "podman build --target build -t scry-build -f Containerfile ."

[tasks.container-build-e2e]
run = "podman build --target e2e -t scry-e2e -f Containerfile ."

[tasks.container-shell]
run = "podman run --rm -it -v .:/workspace:Z -w /workspace scry-build bash"

# CARGO_TARGET_DIR lives inside the container's /tmp: host checkouts may
# symlink ./target elsewhere (e.g. shared caches), which would dangle in the
# container.

[tasks.container-test]
run = "podman run --rm -e CARGO_TARGET_DIR=/tmp/scry-target -v .:/workspace:Z -w /workspace scry-build cargo test"

[tasks.container-test-e2e]
run = "podman run --rm -e CARGO_TARGET_DIR=/tmp/scry-target -v .:/workspace:Z -w /workspace scry-e2e cargo test --test e2e -- --ignored --nocapture"
