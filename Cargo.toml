[package]
name = "scry"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "webp",
] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "desktop",
] }
tempfile = "3"
thiserror = "2"
tiny-skia = "0.12"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = [
    "client",
    "staging",
    "unstable",
] }

[features]
default = []
renderer_pixman = ["smithay/renderer_pixman"]
